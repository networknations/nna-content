name: Validate content and rebuild site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The website build reads website/index_members.md as YAML. Catch parse errors,
  # nameless entries, control characters and mojibake before anything deploys.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install validator dependencies
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund js-yaml@4 gray-matter@4

      - name: Check members file
        run: node .github/scripts/check-members.mjs website/index_members.md

  notify:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages rebuild for nna-site
        env:
          DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          # Cloudflare deploy hooks need no authentication, so the URL is a secret.
          # Rotate it in the Pages dashboard and update CF_DEPLOY_HOOK together.
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CF_DEPLOY_HOOK repository secret is not set; cannot trigger a deploy." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 -X POST "$DEPLOY_HOOK"
